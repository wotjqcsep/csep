<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CSEP 기사앱</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1f2b">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d51112f1641c58ced9ecc03bd942b08f&libraries=services&autoload=false"></script>
<style>
:root{--primary:#3b5bdb;--success:#2f9e44;--warning:#f08c00;--danger:#e03131;--bg:#f1f3f5;--gray-400:#adb5bd;--gray-500:#868e96;--gray-600:#495057}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Malgun Gothic',-apple-system,sans-serif;background:var(--bg);color:#343a40;font-size:15px;max-width:520px;margin:0 auto;min-height:100vh}
.topbar{background:#1a1f2b;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.topbar h1{font-size:18px;color:#6b9cff}
.topbar .who{font-size:13px;color:#c9ced8}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e9ecef;position:sticky;top:52px;z-index:40}
.tab{flex:1;padding:12px;border:none;background:none;font-size:14px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.content{padding:14px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #e3e7ec;border-left:5px solid var(--gray-400);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card.st-new{border-left-color:var(--primary)}
.card.st-assigned{border-left-color:var(--warning)}
.card.st-in_progress{border-left-color:var(--success);background:linear-gradient(135deg,#e6fcf5 0%,#d3f9d8 100%);border:2px solid #2f9e44;border-left:5px solid var(--success);box-shadow:0 0 12px rgba(47,158,68,.35);animation:ipPulse 2s ease-in-out infinite;position:relative}
.card.st-in_progress::before{content:'🚗 출동중';position:absolute;top:-11px;right:12px;background:#2f9e44;color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;letter-spacing:1px;animation:ipBadgePulse 2s ease-in-out infinite}
@keyframes ipPulse{0%,100%{box-shadow:0 0 12px rgba(47,158,68,.35)}50%{box-shadow:0 0 20px rgba(47,158,68,.55)}}
@keyframes ipBadgePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.05)}}
.card.st-completed{border-left-color:var(--gray-400)}
.card.st-cancelled{border-left-color:#868e96}
.card.st-reserved{border-left-color:#f59f00}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #eceef1}
.cust-name{font-size:17px;font-weight:700}
.divider{height:1px;background:#e9ecef;margin:12px 0;border:0}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.badge.new{background:#e7f5ff;color:#1971c2}
.badge.assigned{background:#fff3bf;color:#e67700}
.badge.in_progress{background:#d3f9d8;color:#2b8a3e}
.badge.completed{background:#e9ecef;color:#868e96}
.badge.cancelled{background:#f1f3f5;color:#868e96}
.badge.repairing{background:#f3f0ff;color:#7048e8}
.card.st-repairing{border-left-color:#7048e8}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.info-line{font-size:13px;color:var(--gray-600);margin:3px 0}
.info-line a{color:var(--primary);text-decoration:none}
.symptom{background:#fff9db;border:2px solid #f59f00;border-radius:8px;padding:12px 14px;margin:10px 0;font-size:16px;font-weight:600;color:#343a40;line-height:1.5}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-ghost{background:#f1f3f5;color:var(--gray-600)}
.empty{text-align:center;padding:60px 20px;color:var(--gray-400)}
/* 로그인 */
.login{padding:40px 24px;text-align:center}
.login h2{font-size:24px;color:var(--primary);margin-bottom:6px}
.login p{color:var(--gray-500);margin-bottom:30px;font-size:14px}
.eng-btn{display:block;width:100%;padding:16px;margin-bottom:10px;border:1px solid #dee2e6;border-radius:12px;background:#fff;font-size:16px;cursor:pointer;text-align:left}
.eng-btn:hover{border-color:var(--primary)}
.eng-btn .role{float:right;font-size:12px;color:var(--warning)}
/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:22px}
.sheet h3{font-size:18px;margin-bottom:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:var(--gray-600);margin-bottom:5px}
.fg input,.fg textarea{width:100%;padding:11px 13px;border:1px solid #dee2e6;border-radius:9px;font-size:15px;font-family:inherit}
.fg textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 작업지시 고객 검색 */
.wo-results{border:1px solid #e3e7ec;border-radius:10px;margin-top:6px;max-height:240px;overflow-y:auto;background:#fff}
.wo-results .item{padding:12px 14px;border-bottom:1px solid #f1f3f5;cursor:pointer}
.wo-results .item:last-child{border-bottom:none}
.wo-results .item:active{background:#eef2ff}
.wo-hint{padding:12px 4px;color:var(--gray-400);font-size:13px}
.wo-selected{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--primary);background:#eff3ff;border-radius:10px}
.sec-label{font-size:13px;font-weight:700;color:var(--gray-600);margin:16px 0 8px;padding-top:14px;border-top:1px solid #e9ecef}
</style>
</head>
<body>
<div id="app"><div class="empty">불러오는 중...</div></div>

<script>
const API='/api';
const S={ engineer:null, tab:'active', receptions:[], engineers:[], customers:[], computers:[], presets:[], parts:[], chatUnread:{}, chatOpen:null, stats:null, schedules:[], processing:null, statusFilter:'pending', procPhotos:[], procExisting:[], incomingCalls:[], modalRec:null, settings:{} };
const DEVICE_TYPES={ desktop:'데스크톱', laptop:'노트북', server:'서버', printer:'프린터', other:'기타' };
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>'₩'+(Number(n)||0).toLocaleString();
const WO_TYPE_COLOR={출장:'#1971c2',납품:'#e67700','견적서 납품':'#7048e8'};
function woTypeBadge(memo){
  if(!memo) return '';
  const m=String(memo).match(/^\[([^\]]+)\]/);
  if(!m) return '';
  const t=m[1], c=WO_TYPE_COLOR[t]||'#868e96';
  return `<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;background:${c}">${esc(t)}</span>`;
}
// 금액 입력: 앞자리 0 제거 + 3자리마다 콤마. 저장 시엔 moneyVal()로 숫자만 추출
function fmtMoney(el){ let v=(el.value||'').replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,''); el.value=v?Number(v).toLocaleString('en-US'):''; }
const moneyVal=id=>{ const el=document.getElementById(id); return el?Number((el.value||'').replace(/[^0-9]/g,''))||0:0; };
// 결제수단 칩 선택 UI (select 대신). 값은 hidden input(id)에 저장 → 기존 코드 그대로 읽음
const PAY_METHODS_UI=[['cash','💵 현금'],['transfer','🏦 계좌이체'],['cashreceipt','🧾 현금영수증'],['card','💳 카드'],['tax','📑 세금계산서'],['unpaid','📌 미수']];
// 외주 수수료 — PC와 동일하게 결제수단별 요율(사업자관리 settings) 사용
function engFeeRate(m){ const map={cash:'fee_cash',transfer:'fee_transfer',cashreceipt:'fee_cashreceipt',card:'fee_card',tax:'fee_tax'}; const v=(S.settings||{})[map[m]]; return (v===''||v==null)?0:(Number(v)||0)/100; }
function engFeeRateRec(pm,tax){ const a=engFeeRate(pm||''), b=tax?engFeeRate('tax'):0; return Math.max(a||0,b||0); }
function engAgencyName(){ const n=(S.settings||{}).agency_name; return (n&&n.trim())?n.trim():'우리사무기'; }
function payChips(inputId, cur){
  cur=cur||'cash';
  return `<input type="hidden" id="${inputId}" value="${cur}">
    <div id="${inputId}_chips" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
      ${PAY_METHODS_UI.map(([v,l])=>`<div onclick="pickPay('${inputId}','${v}')" data-v="${v}" style="padding:13px;text-align:center;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:2px solid ${v===cur?'var(--primary)':'#dee2e6'};background:${v===cur?'#eef3ff':'#fff'};color:${v===cur?'var(--primary)':'#495057'}">${l}</div>`).join('')}
    </div>`;
}
function pickPay(inputId, val){
  const hid=document.getElementById(inputId); if(hid)hid.value=val;
  const box=document.getElementById(inputId+'_chips'); if(box){ [...box.children].forEach(ch=>{ const on=ch.getAttribute('data-v')===val; ch.style.border='2px solid '+(on?'var(--primary)':'#dee2e6'); ch.style.background=on?'#eef3ff':'#fff'; ch.style.color=on?'var(--primary)':'#495057'; }); }
  if(inputId==='p_paymethod'&&typeof calcProcPay==='function') calcProcPay();
}
// 기사·대표 색 구분: 대표=빨강, 기사는 id별 고정 색
const ENG_PALETTE=['#1971c2','#2f9e44','#e8590c','#6741d9','#0c8599','#c2255c','#5c940d','#1098ad'];
function engColor(e){ if(!e) return '#868e96'; if(e.is_admin) return '#e03131'; return ENG_PALETTE[(Number(e.id)||0)%ENG_PALETTE.length]; }
function engColorById(id){ return engColor((S.engineers||[]).find(x=>x.id==id)); }
async function api(m,u,b){
  const headers={'Content-Type':'application/json'};
  const token=localStorage.getItem('authToken');
  if(token) headers['Authorization']='Bearer '+token;
  const o={method:m,headers};if(b)o.body=JSON.stringify(b);
  const r=await fetch(API+u,o);
  if(r.status===401){ localStorage.removeItem('authToken'); localStorage.removeItem('csep_eng'); location.reload(); throw new Error('인증 만료'); }
  if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);
  return r.json();
}

// ── 로그인 ──
async function renderLogin(){
  let engineers=[];
  try{ engineers=await api('GET','/engineers'); }catch(e){}
  document.getElementById('app').innerHTML=`
    <div class="login">
      <h2>CSEP 기사앱</h2><p>본인 이름을 선택하세요</p>
      ${engineers.length? engineers.map(e=>`<button class="eng-btn" style="border-left:6px solid ${engColor(e)}" onclick="login(${e.id},${!!e.has_password},${!!e.locked})"><span style="color:${engColor(e)};font-weight:700">${esc(e.name)}${e.locked?' 🔒':''}</span><span class="role" style="color:${engColor(e)}">${e.is_admin?'대표':'기사'}</span></button>`).join('') : '<p style="color:var(--gray-400)">등록된 기사가 없습니다.<br>관리자 화면에서 기사를 먼저 추가하세요.</p>'}
    </div>`;
}
async function login(id,hasPassword,locked){
  if(locked){ alert('🔒 계정이 잠겼습니다.\n비밀번호 3회 오류로 잠금되었습니다.\n관리자(CSEP)에게 잠금 해제를 요청하세요.'); return; }
  let password=null;
  if(hasPassword){ password=prompt('비밀번호를 입력하세요:'); if(password===null)return; }
  try{
    const e=await api('POST','/engineer-login',{engineer_id:id,password});
    S.engineer=e; localStorage.setItem('csep_eng',JSON.stringify(e));
    if(e.token) localStorage.setItem('authToken', e.token);
    connectSSE(); loadReceptions(true); setupPush(); setNativeRole(); pollIncoming();
  }catch(err){ alert(err.message); renderLogin(); }
}
function logout(){ localStorage.removeItem('csep_eng'); localStorage.removeItem('authToken'); S.engineer=null; clearNativeRole(); renderLogin(); }
// 네이티브(APK) 전화감지 게이팅용 역할 저장 (대표만 감지)
function setNativeRole(){
  try{ const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences;
    if(P&&S.engineer){ P.set({key:'csep_role',value:S.engineer.is_admin?'대표':'기사'}); P.set({key:'csep_api',value:API}); }
  }catch(e){}
}
function clearNativeRole(){ try{ const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences; if(P)P.set({key:'csep_role',value:'none'}); }catch(e){} }

// ── toast (alert 대체 — 비차단) ──
function engToast(msg,color){
  const el=document.createElement('div');
  el.style.cssText=`position:fixed;top:env(safe-area-inset-top,12px);left:50%;transform:translateX(-50%);background:${color||'#333'};color:#fff;padding:12px 20px;border-radius:10px;z-index:9999;font-size:14px;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:etIn .25s ease-out`;
  el.textContent=msg; el.onclick=()=>rm();
  if(!document.getElementById('etS')){ const s=document.createElement('style');s.id='etS';s.textContent='@keyframes etIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}@keyframes etOut{from{opacity:1}to{opacity:0}}';document.head.appendChild(s); }
  document.body.appendChild(el);
  function rm(){ if(!el.parentElement)return; el.style.animation='etOut .2s forwards'; setTimeout(()=>el.remove(),200); }
  setTimeout(rm,2500);
}

// ── 데이터 ──
let _engLoadRunning=false;
async function loadReceptions(showLoading){
  if(!S.engineer)return;
  if(_engLoadRunning && !showLoading) return;
  _engLoadRunning=true;
  try{
    const all = S.engineer.is_admin ? '?all=1' : '';   // 대표는 전체 조회 (미배정·전체 탭용)
    S.receptions = await api('GET',`/engineer/${S.engineer.id}/receptions${all}`);
    try{ S.presets = await api('GET','/result-presets'); }catch(e){}   // PC 편집 반영 위해 매번 최신 로드
    try{ S.settings = await api('GET','/settings')||{}; }catch(e){}     // 출장비 기본금액 등
    if(!S.parts.length){ try{ S.parts = await api('GET','/inventory'); }catch(e){} }
    try{ S.chatUnread = await api('GET',`/messages/unread-engineer/${S.engineer.id}`); }catch(e){}
    if(S.engineer.is_admin){
      if(!S.engineers.length){ try{ S.engineers = await api('GET','/engineers'); }catch(e){} }
      // 고객·컴퓨터는 전체 프리로드 안 함(업체 많아지면 느림) → 작업지시에서 이름으로 서버 검색
      try{ S.stats = await api('GET','/stats'); }catch(e){}
    }
    if(showLoading || !isEditing()) render();   // 편집 중(음성·작성)엔 화면 안 지움
  }catch(e){ if(showLoading)document.getElementById('app').innerHTML='<div class="empty">서버 연결 실패</div>'; }
  finally{ _engLoadRunning=false; }
}
// 편집 중이면 배경 새로고침이 화면을 다시 그리지 않게
function isEditing(){ return !!S.processing || S.tab==='wo' || S.tab==='info' || !!document.getElementById('ov') || !!document.getElementById('ov2'); }
function engName(id){ const e=S.engineers.find(x=>x.id==id); return e?e.name:(id?`기사${id}`:'-'); }

// ── 렌더 ──
function render(){
  if(!S.engineer)return renderLogin();
  if(S.processing){ renderProcessing(); return; }
  const isAdmin=S.engineer.is_admin, myId=S.engineer.id;
  const notDone=r=>r.status!=='completed'&&r.status!=='cancelled';   // 취소건은 진행목록에서 제외
  const reserved=r=>r.reserved_date&&notDone(r);
  const ipFirst=list=>[...list.filter(r=>r.status==='in_progress'||r.status==='repairing'),...list.filter(r=>r.status!=='in_progress'&&r.status!=='repairing')]; // 진행중·수리중을 맨 위로
  const mineActive=ipFirst(S.receptions.filter(r=>r.assigned_engineer_id==myId&&notDone(r)));
  const done=S.receptions.filter(r=>r.status==='completed');
  const tabs = isAdmin
    ? [['all','📊 현황'],['wo','➕ 지시'],['done','📁 이력'],['info','📖 정보'],['sched','📅 일정']]
    : [['list','📋 작업목록'],['done','📁 이력'],['sched','📅 일정']];
  if(!tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  let content='';
  if(S.tab==='wo'){ content=`<div id="woTab"></div>`; }
  else if(S.tab==='info'){ content=`<div id="infoTab"></div>`; }
  else if(S.tab==='sched'){ content=`<div id="schedInline"></div>`; }
  else if(S.tab==='done'){ const dl=isAdmin?done:done.filter(r=>r.assigned_engineer_id==myId); content=dl.length?dl.map(cardHtml).join(''):'<div class="empty">완료 작업이 없습니다</div>'; }
  else if(isAdmin){
    const f=S.statusFilter||'pending';
    const cnt={pending:S.receptions.filter(r=>notDone(r)&&!reserved(r)).length,reserved:S.receptions.filter(reserved).length,completed:done.length,all:S.receptions.length};
    const flist=ipFirst(f==='reserved'?S.receptions.filter(reserved):f==='completed'?done:f==='all'?S.receptions:S.receptions.filter(r=>notDone(r)&&!reserved(r)));
    const chips=[['pending','🔴 미처리'],['reserved','🟡 예약'],['completed','🟢 완료'],['all','전체']];
    content=`<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">${chips.map(([k,l])=>`<span onclick="S.statusFilter='${k}';render()" style="padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer;${f===k?'background:var(--primary);color:#fff':'background:#fff;border:1px solid #dee2e6'}">${l} ${cnt[k]}</span>`).join('')}</div>`
      +(flist.length?flist.map(cardHtml).join(''):'<div class="empty">작업이 없습니다</div>');
  } else { content=mineActive.length?mineActive.map(cardHtml).join(''):'<div class="empty">작업이 없습니다</div>'; }
  const soundName=localStorage.getItem('csep_sound')||'noti1';
  document.getElementById('app').innerHTML=`
    <div class="topbar"><h1>🔧 현장 기사 앱</h1><span class="who"><span style="color:${isAdmin?'#ff6b6b':'#74c0fc'};font-weight:700">${esc(S.engineer.name)} ${isAdmin?'대표':'기사'}</span> · <a onclick="logout()" style="color:#6b9cff;cursor:pointer">로그아웃</a></span></div>
    <div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${S.tab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`).join('')}</div>
    <div style="padding:12px 14px 0;display:flex;gap:6px">
      <button class="btn" style="margin:0;background:#2b3140;color:#fff;flex:1" onclick="openSoundPicker()">🔔 알림 소리 선택 (${soundName})</button>
      ${isAdmin && S.tab==='all' ? `<button class="btn" style="margin:0;background:#1971c2;color:#fff;flex:1" onclick="openRouteOptimizer()">🗺️ 배차 경로</button>` : ''}
    </div>
    <div class="content">${content}</div>`;
  if(S.tab==='wo')renderWoTab();
  if(S.tab==='info')renderInfoTab();
  if(S.tab==='sched')renderScheduleInline();
}
function setTab(t){ S.tab=t; if(t==='sched'){ schedState={ym:ymStr(new Date()),sel:null}; loadSchedules().then(()=>{render();window.scrollTo(0,0);}); return; } render(); window.scrollTo(0,0); }

function cardHtml(r){
  const isAdmin=S.engineer.is_admin, mine=r.assigned_engineer_id==S.engineer.id;
  const isRes=r.reserved_date&&r.status!=='completed'&&r.status!=='cancelled';
  const st=isRes?'예약':({new:'미처리',assigned:'미처리',in_progress:'진행중',repairing:'수거·점검',completed:'완료',cancelled:'취소'}[r.status]||r.status);
  const badgeClass=isRes?'assigned':r.status;

// 대표: 비용청구 (콜 취소) — 콜은 취소하되 출장비 청구. 결제수단 선택 모달
function engChargedCancel(id){

      <div style="font-size:13px;color:var(--gray-500);margin-bottom:12px">콜은 취소하되 출장비를 청구합니다. 내역은 기록에 남습니다.</div>
      <div class="fg"><label>청구 금액 * ${defFee?'<span style="color:var(--gray-400);font-weight:400">(출장비 기본 자동입력)</span>':''}</label><input id="cc_amt" type="text" inputmode="numeric" value="${defStr}" placeholder="0" oninput="fmtMoney(this)"></div>

async function submitChargedCancel(id){
  const amt=moneyVal('cc_amt'); if(!amt){ alert('청구 금액을 입력하세요'); return; }
  const pm=document.getElementById('cc_pm').value;
  const reason=(document.getElementById('cc_reason')||{}).value||'';
  const btn=document.activeElement; if(btn&&btn.tagName==='BUTTON') btn.disabled=true;
  try{ await api('PUT',`/receptions/${id}/payment`,{ visit_fee:amt, labor_fee:0, parts_fee:0, payment_method:pm, outcome:'charged_cancel', solution:'[비용청구 콜취소]'+(reason?' '+reason:''), complete:true }); }
  catch(e){ alert('처리 실패: '+(e&&e.message||e)); return; }
  finally{ if(btn) btn.disabled=false; }
  const ov=document.getElementById('ov2'); if(ov)ov.remove();
  S.processing=null; await loadReceptions(); engToast('비용청구 후 콜 취소되었습니다','#2b8a3e');
}
function navTmapFor(id){ const r=S.receptions.find(x=>x.id==id); if(r&&r.customer_address){ markPickup(id); navTmap(r.customer_address); } else alert('주소가 없습니다'); }
function navKakaoFor(id){ const r=S.receptions.find(x=>x.id==id); if(r&&r.customer_address){ markPickup(id); navKakao(r.customer_address); } else alert('주소가 없습니다'); }
async function navTmap(addr){
  if(!addr) return;
  try{ const c=await (await fetch(`${API}/geocode?address=${encodeURIComponent(addr)}`)).json();
    if(c.lon&&c.lat){ window.location.href=`tmap://route?goalname=${encodeURIComponent(addr)}&goalx=${c.lon}&goaly=${c.lat}`; return; }
  }catch(e){}
  window.location.href=`tmap://search?keyword=${encodeURIComponent(addr)}`;
}
async function navKakao(addr){
  if(!addr) return;
  const enc=encodeURIComponent(addr);
  const native=window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform();
  try{ const c=await (await fetch(`${API}/geocode?address=${encodeURIComponent(addr)}`)).json();
    if(c.lon&&c.lat){ const ep=`${c.lat},${c.lon}`;
      if(native) window.location.href=`kakaomap://route?ep=${ep}&by=CAR`;
      else if(/android/i.test(navigator.userAgent)) window.location.href=`intent://route?ep=${ep}&by=CAR#Intent;scheme=kakaomap;package=net.daum.android.map;end`;
      else window.open(`https://map.kakao.com/link/to/${enc},${c.lat},${c.lon}`,'_blank');
      return; }
  }catch(e){}
  // 좌표 없음(카카오 키 미설정) → 이전 작동 방식인 웹 지도 링크로 폴백
  window.open(`https://map.kakao.com/?q=${enc}`,'_blank');
}

function devSpec(kind, raw){
  let list=[]; if(raw){ try{ const a=JSON.parse(raw); if(Array.isArray(a)) list=a; }catch(e){ if(String(raw).trim()) return String(raw); } }
  if(!list.length) return '';
  if(kind==='ram'){ const total=list.reduce((s,x)=>s+(parseFloat(x.size)||0),0);
    const parts=list.map(x=>[(x.size?x.size+'GB':''),x.spec,x.maker].filter(Boolean).join(' ')).filter(Boolean).join(' + ');
    return (total?total+'GB':'')+(parts?' ('+parts+')':''); }
  if(kind==='ssd') return list.map(x=>[x.type,x.cap,x.maker].filter(Boolean).join(' ')).filter(Boolean).join(', ');
  if(kind==='hdd') return list.map(x=>[x.cap,x.maker].filter(Boolean).join(' ')).filter(Boolean).join(', ');
  return list.map(x=>Object.values(x).filter(Boolean).join(' ')).filter(Boolean).join(', ');
}
function devMb(raw){ if(!raw) return ''; try{ const o=JSON.parse(raw); if(o&&typeof o==='object'&&!Array.isArray(o)) return [o.plat,o.maker,o.chipset,o.model].filter(Boolean).join(' '); }catch(e){} return String(raw); }

function devMonitor(raw){ if(!raw) return ''; try{ const o=JSON.parse(raw); if(o&&typeof o==='object'&&!Array.isArray(o)) return [o.inch?o.inch+'인치':'', o.model, (o.ports||[]).join('/')].filter(Boolean).join(' · '); }catch(e){} return String(raw); }

function scanProgress(msg){ const el=document.getElementById('custDevSheet');
  if(el) el.innerHTML=`<h3>🖥️ 글자 인식 중…</h3><div class="empty" style="padding:30px 0">📷 ${msg}<br><span style="font-size:12px;color:var(--gray-400)">처음 1회는 인식엔진을 내려받아 조금 걸립니다</span></div>`;

// OCR 전처리: 고해상도 유지 + 흑백 + (어두운 화면이면) 반전 + 대비강화 → BIOS 인식률↑
function preprocessForOcr(dataUrl, cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    const max=1800; if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
    let im; try{ im=ctx.getImageData(0,0,w,h); }catch(e){ cb(dataUrl); return; }
    const d=im.data; let sum=0;
    for(let i=0;i<d.length;i+=4){ const g=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114; d[i]=d[i+1]=d[i+2]=g; sum+=g; }
    const mean=sum/(d.length/4); const invert=mean<115;   // 어두운 배경이면 반전
    for(let i=0;i<d.length;i+=4){ let g=d[i]; if(invert)g=255-g; g=(g-128)*1.6+128; g=g<0?0:g>255?255:g; d[i]=d[i+1]=d[i+2]=g; }
    ctx.putImageData(im,0,0);
    cb(c.toDataURL('image/jpeg',0.92));
  };
  img.onerror=()=>cb(dataUrl);
  img.src=dataUrl;
}
function scanBiosPhoto(input, merge){
  const f=input.files&&input.files[0]; input.value='';
  if(!f) return;
  const cur = merge ? collectDevScanForm() : null;   // 보강이면 현재 값 보존
  scanProgress(merge?'보강 사진을 분석하고 있습니다…':'사진을 분석하고 있습니다…');
  const reader=new FileReader();
  reader.onload=e=>{
    preprocessForOcr(e.target.result, async d=>{
      let r={};
      try{ r=await api('POST','/computers/ai-scan',{image:d})||{}; }

function mergeDevData(cur,add){
  cur=cur||{}; add=add||{}; const mb=add.motherboard||{}; const cmb=cur.motherboard||{};
  const pick=(a,b)=>(a&&String(a).trim())?a:(b||'');
  const key=x=>JSON.stringify(x).toLowerCase().replace(/[^a-z0-9]/g,'');
  const mergeArr=(a,b)=>{ a=a||[];b=b||[]; const seen=new Set(a.map(key)); const out=[...a]; for(const x of b){ const k=key(x); if(k&&!seen.has(k)){seen.add(k);out.push(x);} } return out; };
  return { name:pick(cur.name,add.name), device_type:cur.device_type||add.device_type||'desktop',
    cpu:pick(cur.cpu,add.cpu), gpu:pick(cur.gpu,add.gpu), serial_number:pick(cur.serial_number,add.serial_number), bios_version:pick(cur.bios_version,add.bios_version),
    motherboard:{plat:pick(cmb.plat,mb.plat),maker:pick(cmb.maker,mb.maker),chipset:pick(cmb.chipset,mb.chipset),model:pick(cmb.model,mb.model)},
    ram:mergeArr(cur.ram,add.ram), ssd:mergeArr(cur.ssd,add.ssd), hdd:mergeArr(cur.hdd,add.hdd),
    _src:add._src, _ocr:add._ocr||cur._ocr };
}

const SCHED_COL={sched:'#1971c2', resv:'#f08c00', done:'#2f9e44'};
function buildSchedByDate(){
  const byDate={};
  const add=(date,item)=>{ if(!date)return; (byDate[date]=byDate[date]||[]).push(item); };
  (S.schedules||[]).forEach(s=>add(s.date,{k:'sched',s}));
  (S.receptions||[]).forEach(r=>{
    if(r.status==='cancelled') return;
    if(r.status==='completed') add((r.completed_at||'').slice(0,10),{k:'done',r});
    else if(r.reserved_date) add(r.reserved_date,{k:'resv',r});
  });
  return byDate;
}

function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{ const img=new Image(); img.onload=()=>{
    // A/S 사진: 시리얼·에러화면 가독성 위해 해상도 1280·품질 0.72 (트래픽 대비 화질 균형)
    const max=1280; let w=img.width,h=img.height;
    if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;} }
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.72));
  }; img.src=e.target.result; };
  reader.readAsDataURL(file);
}

// 어떤 입력칸에도 붙일 수 있는 마이크 버튼 (id는 대상 입력칸 id)
function micBtn(id, append){ const ap=(append===false)?'false':'true'; return `<button id="mic_${id}" type="button" onclick="startVoice('${id}',${ap})" style="border:1px solid #dee2e6;background:#fff;border-radius:9px;width:44px;height:42px;font-size:20px;cursor:pointer;flex:none">🎤</button>`; }
function micField(id, label, val, placeholder){
  return `<div class="fg"><label>${label}</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input id="${id}" value="${esc(val)||''}" placeholder="${placeholder||''}" style="flex:1">
      ${micBtn(id)}
    </div></div>`;
}
// 🎤 음성입력: ① Capacitor 네이티브 음성인식(APK) → ② 브라우저 Web Speech → ③ 키보드 마이크 안내
async function startVoice(targetId, append){
  const el=document.getElementById(targetId); if(!el) return;
  const btn=document.getElementById('mic_'+targetId);
  const icon=t=>{ if(btn) btn.textContent=t; };
  const put=txt=>{ if(!txt) return; const cur=el.value||''; el.value=(append!==false && cur) ? (cur.replace(/\s*$/,'')+' '+txt) : txt; el.dispatchEvent(new Event('input',{bubbles:true})); };
  const cap=window.Capacitor;
  const SR=cap && cap.Plugins && cap.Plugins.SpeechRecognition;
  // ① 네이티브 (APK)
  if(cap && cap.isNativePlatform && cap.isNativePlatform() && SR){
    try{
      let perm=null; try{ perm=await SR.checkPermissions(); }catch(e){}
      if(!perm || perm.speechRecognition!=='granted'){
        const req=await SR.requestPermissions();
        if(req && req.speechRecognition!=='granted'){ alert('음성 인식을 쓰려면 마이크 권한을 허용해주세요.'); return; }
      }
      icon('🔴');
      const res=await SR.start({ language:'ko-KR', maxResults:1, partialResults:false, popup:false });
      icon('🎤');
      put(res && res.matches && res.matches[0]);
      return;
    }catch(e){ icon('🎤'); console.warn('네이티브 음성인식 실패, 폴백 시도:', e && e.message); }
  }
  // ② 브라우저 Web Speech API
  const WSR=window.SpeechRecognition || window.webkitSpeechRecognition;
  if(WSR){
    try{
      const rec=new WSR(); rec.lang='ko-KR'; rec.interimResults=false; rec.maxAlternatives=1;
      icon('🔴');
      rec.onresult=e=>put(e.results[0][0].transcript);
      rec.onerror=()=>icon('🎤');
      rec.onend=()=>icon('🎤');
      rec.start();
      return;
    }catch(e){ icon('🎤'); }
  }
  // ③ 둘 다 불가 → 키보드 마이크로 안내
  el.focus();
  alert('키보드가 뜨면 키보드의 마이크(🎤) 버튼을 눌러 말씀하세요.');
}

let routeState={map:null, markers:[], polylines:[], optimized:[], currentLoc:null, loading:false, sections:null};
// 구간(1→2→3…) 구분용 중복 안 되는 색 팔레트 (마커·경로선·리스트 동일 색)
const LEG_COLORS=['#4263eb','#f76707','#2f9e44','#ae3ec9','#1098ad','#e64980','#5c940d','#7048e8','#0ca678','#d6336c','#f59f00','#12b886'];
const legColor=i=>LEG_COLORS[i%LEG_COLORS.length];
async function openRouteOptimizer(){
  const myId=S.engineer.id;
  const notDone=r=>r.status!=='completed'&&r.status!=='cancelled';   // 취소건은 진행목록에서 제외
  // 앱 '미처리' 칩과 동일 정의: 완료 아님 + 예약 아님 (예약 건은 배차 경로에서 제외)
  const pending=S.receptions.filter(r=>r.assigned_engineer_id==myId&&notDone(r)&&!r.reserved_date);
  if(!pending.length){ alert('미처리 작업이 없습니다 (예약 건은 제외됩니다)'); return; }

  const withAddr=pending.filter(r=>r.customer_address);
  const noAddr=pending.filter(r=>!r.customer_address);

  if(!withAddr.length){
    alert('주소가 있는 작업이 없습니다.\n\n주소 없음: ' + noAddr.map(r=>r.customer_name||r.customer_phone).join(', '));
    return;
  }

  if(noAddr.length){
    alert(`⚠️ ${noAddr.length}건은 주소가 없어 제외됨:\n` + noAddr.map(r=>r.customer_name||r.customer_phone).join(', '));
  }
  routeState.loading=true;
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" style="height:100%;max-height:100%;display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:0"><div style="padding:18px 22px;flex-shrink:0"><h3 style="margin:0">🗺️ 배차 경로 최적화</h3><div style="font-size:12px;color:var(--gray-500);margin-top:4px">현재 위치 기준 · 주소있음 ${withAddr.length}건</div></div><div id="routeContainer" style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column"><div style="text-align:center;padding:40px 20px;color:var(--gray-400)">계산 중...</div></div></div></div>`);
  try{
    await ensureKakao();
    const currentLoc=await getCurrentLocation();
    routeState.currentLoc=currentLoc;
    // 지도선은 직선 유지. 순서·거리는 optimizeRoute가 도로거리 기준으로 계산(실패 시 직선)
    routeState.sections=null; routeState.realTotal=null; routeState.routeMode='직선';
    const optimized=await optimizeRoute(currentLoc, withAddr);
    routeState.optimized=optimized;
    renderRouteOptimized(optimized, currentLoc);
  }catch(e){
    console.error('경로 최적화 오류:', e);
    alert('경로 계산에 실패했습니다: '+e.message);
  }
  routeState.loading=false;
}
// 카카오 지도 SDK 로딩 보장 (autoload=false → load 호출 필요)
function ensureKakao(){
  return new Promise((resolve,reject)=>{
    if(typeof kakao==='undefined' || !kakao.maps || !kakao.maps.load){
      reject(new Error('지도 SDK를 불러오지 못했습니다 (네트워크·키·도메인 확인)')); return;
    }
    kakao.maps.load(()=>resolve());
  });
}
async function getCurrentLocation(){
  // ① Capacitor(APK) 네이티브 위치 — 런타임 권한 요청 포함
  const cap=window.Capacitor;
  if(cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Geolocation){
    const Geo=cap.Plugins.Geolocation;
    try{
      const perm=await Geo.checkPermissions();
      if(perm.location!=='granted' && perm.coarseLocation!=='granted'){
        const req=await Geo.requestPermissions();
        if(req.location!=='granted' && req.coarseLocation!=='granted'){
          throw new Error('위치 권한이 거부되었습니다. 설정 > 앱 > 권한에서 위치를 허용해주세요.');
        }
      }
      const pos=await Geo.getCurrentPosition({enableHighAccuracy:true, timeout:10000});
      return {lat:pos.coords.latitude, lng:pos.coords.longitude};
    }catch(e){
      throw new Error(e.message||'현재 위치를 가져올 수 없습니다');
    }
  }
  // ② 브라우저 위치
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error('위치 서비스를 지원하지 않습니다')); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude}),
      err=>reject(new Error('위치 권한: '+err.message)),
      {timeout:10000, enableHighAccuracy:true}
    );
  });
}
// 직선거리(Haversine) 기반 추정 — 카카오 지도 JS SDK엔 길찾기가 없어 직선거리로 순서 정렬
// (실제 도로거리/시간은 각 지점 '네비' 버튼으로 카카오맵/티맵에서 확인)
function calculateDistance(from, to){
  const R=6371000; // 지구 반경(m)
  const toRad=d=>d*Math.PI/180;
  const dLat=toRad(to.lat-from.lat);
  const dLng=toRad(to.lng-from.lng);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(from.lat))*Math.cos(toRad(to.lat))*Math.sin(dLng/2)**2;
  const dist=R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); // 직선거리(m)
  return {distance: dist, duration: Math.round(dist/1000/30*3600)}; // 평균 30km/h 가정 소요초
}
async function optimizeRoute(startLoc, receptions){
  // 1) 모든 주소 → 좌표 변환
  const geocoder=new kakao.maps.services.Geocoder();
  const geocode=addr=>new Promise(resolve=>{
    geocoder.addressSearch(addr, (result,status)=>{
      if(status===kakao.maps.services.Status.OK && result.length){
        resolve({lat:parseFloat(result[0].y), lng:parseFloat(result[0].x)});
      }else resolve(null);
    });
  });
  const points=[];
  for(const r of receptions){ points.push({...r, coords: await geocode(r.customer_address)}); }
  const withCoords=points.filter(p=>p.coords);
  const failed=points.filter(p=>!p.coords);   // 좌표 인식 실패 건
  let ordered=null;
  // 2) 실제 도로거리 기준 순서 (서버 카카오모빌리티) — 지도선은 직선, 순서·거리만 도로 기준
  try{
    const resp=await api('POST','/route-order',{ origin:{lat:startLoc.lat,lng:startLoc.lng}, stops:withCoords.map(p=>({id:p.id, lat:p.coords.lat, lng:p.coords.lng})) });
    if(resp && resp.ok && Array.isArray(resp.order) && resp.order.length===withCoords.length){
      ordered=resp.order.map(o=>{ const p=withCoords.find(x=>String(x.id)===String(o.id)); return {...p, distance:o.distance, duration:o.duration}; });
      routeState.routeMode = resp.road ? '실제도로' : '직선';
    }
  }catch(e){ console.warn('도로거리 순서 실패 → 직선 폴백', e); }
  // 3) 폴백: 직선거리 최근접이웃
  if(!ordered){
    ordered=[]; const remaining=withCoords.slice(); let cur=startLoc;
    while(remaining.length){
      let bi=0, bd=Infinity;
      for(let i=0;i<remaining.length;i++){ const d=calculateDistance(cur, remaining[i].coords).distance; if(d<bd){ bd=d; bi=i; } }
      const next=remaining.splice(bi,1)[0];
      const leg=calculateDistance(cur, next.coords);
      ordered.push({...next, distance:leg.distance, duration:leg.duration});
      cur=next.coords;
    }
    routeState.routeMode='직선';
  }
  failed.forEach(f=>ordered.push({...f, coords:null, distance:0, duration:0, geoFailed:true}));
  return ordered;
}
function renderRouteOptimized(optimized, currentLoc){
  const container=document.getElementById('routeContainer');
  if(!container)return;
  // 모바일 세로 배치: 위=지도(고정 높이), 아래=리스트(스크롤)
  container.innerHTML=`
    <div style="display:flex;flex-direction:column;height:100%;min-height:0;gap:10px;padding:12px">
      <div style="height:50vh;min-height:280px;flex-shrink:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e3e7ec" id="mapDiv"></div>
      <div style="flex:1;min-height:0;background:#f8f9fa;border-radius:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid #e3e7ec;padding:12px" id="routeList"></div>
    </div>`;
  initRouteMap(currentLoc, optimized);
  renderRouteList(optimized, currentLoc);
  // 레이아웃 확정 후 지도 크기 재계산 (안 하면 회색으로 뜸)
  setTimeout(()=>{ if(routeState.map){ routeState.map.relayout(); fitRouteBounds(currentLoc, optimized); } }, 200);
}
function initRouteMap(currentLoc, optimized){
  const mapDiv=document.getElementById('mapDiv');
  if(!mapDiv)return;
  const map=new kakao.maps.Map(mapDiv, {center: new kakao.maps.LatLng(currentLoc.lat, currentLoc.lng), level:8});
  routeState.map=map;
  routeState.markers=[];
  routeState.polylines=[];
  routeState.infowindow=new kakao.maps.InfoWindow({removable:true, zIndex:10});
  const startMarker=new kakao.maps.Marker({
    position: new kakao.maps.LatLng(currentLoc.lat, currentLoc.lng),
    map,
    title:'출발점 (현재위치)',
    clickable:false
  });
  startMarker.setImage(createMarkerImage('#2f9e44',''));
  routeState.markers.push(startMarker);
  const pathCoords=[new kakao.maps.LatLng(currentLoc.lat, currentLoc.lng)];
  optimized.forEach((r,idx)=>{
    if(!r.coords)return;
    const pos=new kakao.maps.LatLng(r.coords.lat, r.coords.lng);
    const col=legColor(idx);
    const marker=new kakao.maps.Marker({ position:pos, map, title:`${idx+1}. ${r.customer_name||r.customer_phone}`, zIndex:20 });
    marker.setImage(createMarkerImage(col,String(idx+1)));
    routeState.markers.push(marker);
    // 마커 클릭 → 팝업(겹침 대비). 팝업 안에서 상세보기 진입
    const name=(r.customer_name||r.customer_phone||'고객').replace(/'/g,'');
    const addr=(r.customer_address||'').replace(/'/g,'');
    kakao.maps.event.addListener(marker,'click',()=>{
      const content=`<div style="padding:8px 10px;min-width:150px;font-size:12px;font-family:'Malgun Gothic',sans-serif">
        <div style="font-weight:700;margin-bottom:2px"><span style="color:${col}">●</span> ${idx+1}. ${name}</div>
        <div style="color:#666;margin-bottom:6px">${addr}</div>
        <div onclick="handleRouteItemClick(${r.id})" style="text-align:center;background:#3b5bdb;color:#fff;border-radius:6px;padding:6px;cursor:pointer">상세보기 / 처리</div>
      </div>`;
      routeState.infowindow.setContent(content);
      routeState.infowindow.open(map, marker);
    });
    pathCoords.push(pos);
  });
  drawRouteLines(map, pathCoords);
  fitRouteBounds(currentLoc, optimized);
}
// 경로선 그리기: 구간(현위치→1→2→3…)마다 고유색 직선. 마커 색과 동일.
// fallbackPath = [현위치, 1번, 2번, …] 순서의 LatLng 배열
function drawRouteLines(map, fallbackPath){
  for(let i=0;i+1<fallbackPath.length;i++){
    routeState.polylines.push(new kakao.maps.Polyline({
      path:[fallbackPath[i], fallbackPath[i+1]],
      strokeWeight:5, strokeColor:legColor(i), strokeOpacity:0.85, strokeStyle:'solid', map, zIndex:2
    }));
  }
}
function fitRouteBounds(currentLoc, optimized){
  if(!routeState.map)return;
  const bounds=new kakao.maps.LatLngBounds();
  bounds.extend(new kakao.maps.LatLng(currentLoc.lat, currentLoc.lng));
  optimized.forEach(r=>{ if(r.coords)bounds.extend(new kakao.maps.LatLng(r.coords.lat, r.coords.lng)); });
  routeState.map.setBounds(bounds);
}
function createMarkerImage(color, text){
  const canvas=document.createElement('canvas');
  canvas.width=32;
  canvas.height=42;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(16,16,12,0,Math.PI*2);
  ctx.fill();
  if(text){
    ctx.fillStyle='#fff';
    ctx.font='bold 14px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(text,16,16);
  }
  return new kakao.maps.MarkerImage(canvas.toDataURL('image/png'), new kakao.maps.Size(32,42), {offset: new kakao.maps.Point(16,42)});
}
function renderRouteList(optimized, currentLoc){

    ${optimized.map((r,idx)=>{
      totalDist+=r.distance;

        : `🚗 ${(r.distance/1000).toFixed(1)}km · ⏱️ ${Math.round(r.duration/60)}분`;
      return `<div onclick="handleRouteItemClick(${r.id})" style="padding:10px;background:#fff;border-radius:8px;margin-bottom:8px;cursor:pointer;border-left:5px solid ${col}">
        <div style="font-weight:700;font-size:13px;margin-bottom:3px"><span style="display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;background:${col};color:#fff;border-radius:50%;font-size:11px;margin-right:5px">${idx+1}</span>${esc(r.customer_name||r.customer_phone||'고객')}</div>
        <div style="font-size:11px;color:var(--gray-600);margin:2px 0">📍 ${esc(r.customer_address||'')}</div>
        <div style="font-size:11px;color:var(--gray-600);margin-top:3px">${distTxt}${real&&!r.geoFailed?'':' <span style="color:var(--gray-400)">(직선)</span>'}</div>
      </div>`;
    }).join('')}
    <div style="border-top:1px solid #dee2e6;padding-top:8px;margin-top:8px;font-size:12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>총 이동${real?'(도로)':'(직선)'}:</span><strong>${((routeState.realTotal?routeState.realTotal.distance:totalDist)/1000).toFixed(1)}km</strong></div>
      <div style="display:flex;justify-content:space-between"><span>예상 시간:</span><strong>약 ${Math.round((routeState.realTotal?routeState.realTotal.duration:totalTime)/60)}분</strong></div>
    </div>
    <button class="btn btn-primary" onclick="launchRouteNav()" style="margin-top:10px">🧭 첫번째 배차 네비게이션</button>
    <button class="btn btn-ghost" onclick="closeSheet()" style="margin-top:6px">닫기</button>`;

let _audioCtx=null;
function getAudioCtx(){
  if(!_audioCtx||_audioCtx.state==='closed'){
    _audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(_audioCtx.state==='suspended') _audioCtx.resume().catch(()=>{});
  return _audioCtx;
}
// Android WebView 자동재생 제한 우회: 첫 터치에 AudioContext unlock
document.addEventListener('touchstart',function _unlock(){
  try{ getAudioCtx(); }catch(e){}
  document.removeEventListener('touchstart',_unlock,true);
},true);
document.addEventListener('click',function _unlock2(){
  try{ getAudioCtx(); }catch(e){}
  document.removeEventListener('click',_unlock2,true);
},true);

function playEngNotification(){
  try{
    const ctx=getAudioCtx();
    const now=ctx.currentTime;
    [[800,.15],[1000,.15],[800,.2]].forEach(([freq,dur],i)=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='square'; osc.frequency.value=freq;
      gain.gain.setValueAtTime(0.3,now+i*0.2);
      gain.gain.exponentialRampToValueAtTime(0.01,now+i*0.2+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+i*0.2); osc.stop(now+i*0.2+dur+0.05);
    });
  }catch(e){}
  showAssignmentBanner();
}
function showAssignmentBanner(){
  if(document.getElementById('eng-noti-banner')) return;
  const div=document.createElement('div'); div.id='eng-noti-banner';
  div.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#1971c2;color:#fff;padding:14px 16px;text-align:center;font-weight:700;font-size:15px;box-shadow:0 2px 12px rgba(0,0,0,.3);cursor:pointer;animation:slideDown .3s ease';
  div.textContent='📋 새 업무지시가 도착했습니다!';
  div.onclick=()=>{ div.remove(); S.tab=S.engineer&&S.engineer.is_admin?'all':'list'; render(); };
  document.body.appendChild(div);
  setTimeout(()=>{ if(div.parentNode) div.remove(); },8000);
}

// ── SSE ──
let _sseDebounce=null;
function sseLoadReceptions(){ clearTimeout(_sseDebounce); _sseDebounce=setTimeout(()=>loadReceptions(),300); }
let _currentES=null;
function connectSSE(){
  if(!S.engineer)return;
  if(_currentES){ try{_currentES.close();}catch(e){} _currentES=null; }
  try{
    const es=new EventSource(`${API}/engineer-stream/${S.engineer.id}?token=${encodeURIComponent(localStorage.getItem('authToken')||'')}`);
    _currentES=es;
    es.addEventListener('new_assignment',()=>{ sseLoadReceptions(); playEngNotification(); if(navigator.vibrate)navigator.vibrate(400); });
    // PC·다른 대표의 접수 생성/배정/상태/삭제 → 목록 실시간 동기화 (편집 중이면 화면 유지)
    es.addEventListener('reception_new',()=>{ sseLoadReceptions(); });
    es.addEventListener('reception_update',()=>{ sseLoadReceptions(); });
    es.addEventListener('reception_deleted',()=>{ sseLoadReceptions(); });
    es.addEventListener('new_message',e=>{ let d={}; try{d=JSON.parse(e.data);}catch(x){}
      if(S.chatOpen==d.reception_id){ openChat(d.reception_id); }
      else { S.chatUnread[d.reception_id]=(S.chatUnread[d.reception_id]||0)+1; if(!document.getElementById('ov'))render(); if(navigator.vibrate)navigator.vibrate(200); }
    });
    es.onerror=()=>{ es.close(); setTimeout(connectSSE,5000); };
  }catch(e){}
}

// ── 안드로이드 하드웨어 뒤로가기 → 이전 화면 ──
function handleBack(){
  // 1) 채팅/모달 열려있으면 닫기 (ov2가 위에 있으면 그것부터)
  if(S.chatOpen){ closeChat(); return true; }
  // 장치 상세(여러 대) → 목록으로 (전체 닫기 전에)
  if(document.getElementById('custDevSheet') && custDevState.view==='detail' && custDevState.list.length>1){ renderCustDevList(); return true; }
  const ov2=document.getElementById('ov2'); if(ov2){ ov2.remove(); return true; }
  if(document.getElementById('ov')){ closeSheet(); return true; }
  // 2) 작업 처리 화면 → 목록으로
  if(S.processing){ closeProcessing(); return true; }
  // 3) 작업지시에서 고객 선택 상태면 선택 해제
  if(S.tab==='wo' && woState && woState.customer){ woClear(); return true; }
  // 4) 기본 탭이 아니면 기본 탭으로
  const home = S.engineer && S.engineer.is_admin ? 'all' : 'list';
  if(S.engineer && S.tab!==home){ S.tab=home; render(); return true; }
  return false; // 처리할 게 없으면 기본 동작(앱 종료)
}
function setupBackButton(){
  const App=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!App||!App.addListener) return;
  // 닫을 화면이 있으면 닫고, 없으면 앱을 '종료'가 아니라 '백그라운드로 최소화'
  // (완전 종료 시 전화감지·푸시가 끊기므로 minimizeApp으로 앱은 살려둠)
  App.addListener('backButton', ()=>{
    if(handleBack()) return;   // 닫을 화면(모달·처리·탭)이 있으면 그것부터 닫기
    // 홈에서 백 → 앱 종료가 아니라 백그라운드로 최소화. exitApp은 절대 호출하지 않음.
    try{ if(App.minimizeApp) App.minimizeApp(); }catch(e){}
  });
}

let infoState={maker:'',type:''};
function renderInfoTab(){
  const el=document.getElementById('infoTab'); if(!el)return;
  const makers=BIOS_DATA.map(d=>d.maker);
  const sel=BIOS_DATA.find(d=>d.maker===infoState.maker);
  const types=sel?sel.types:[];
  if(sel&&!types.includes(infoState.type)) infoState.type='';

  let body='';
  if(sel&&infoState.type){
    const t=infoState.type;
    body+=`<div class="card" style="border-left-color:#1971c2">
      <div style="font-weight:700;font-size:16px;margin-bottom:10px">🖥️ ${esc(sel.maker)} — ${esc(t)}</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse">
        <tr style="border-bottom:1px solid #e9ecef"><td style="padding:8px;font-weight:600;white-space:nowrap;color:#1971c2">BIOS 진입 키</td><td style="padding:8px">${esc(sel.entry[t]||'-')}</td></tr>
        <tr style="border-bottom:1px solid #e9ecef"><td style="padding:8px;font-weight:600;white-space:nowrap;color:#1971c2">진입 타이밍</td><td style="padding:8px">${esc(sel.entryTiming[t]||'-')}</td></tr>
        <tr style="border-bottom:1px solid #e9ecef"><td style="padding:8px;font-weight:600;white-space:nowrap;color:#1971c2">리커버리 키</td><td style="padding:8px">${esc(sel.recovery[t]||'-')}</td></tr>
        <tr><td style="padding:8px;font-weight:600;white-space:nowrap;color:#1971c2">부팅 메뉴 키</td><td style="padding:8px">${esc(sel.bootMenu[t]||'-')}</td></tr>
      </table>
    </div>`;

    body+=`<div class="card" style="border-left-color:#e67700">
      <div style="font-weight:700;font-size:15px;margin-bottom:8px">🔊 비프음 코드</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse">
        <tr style="background:#f8f9fa;font-weight:600"><td style="padding:6px 8px;border-bottom:1px solid #dee2e6">패턴</td><td style="padding:6px 8px;border-bottom:1px solid #dee2e6">의미</td></tr>
        ${sel.beeps.map(b=>`<tr style="border-bottom:1px solid #f1f3f5"><td style="padding:6px 8px;white-space:nowrap">${esc(b.pattern)}</td><td style="padding:6px 8px">${esc(b.meaning)}</td></tr>`).join('')}
      </table>
    </div>`;

    const resets=(sel.biosReset||{})[t]||[];
    if(resets.length){
      body+=`<div class="card" style="border-left-color:#e03131">
        <div style="font-weight:700;font-size:15px;margin-bottom:8px">🔓 BIOS 초기화 (비밀번호 분실 시)</div>`;
      resets.forEach((r,i)=>{
        const rid='br_'+i;
        body+=`<div style="border:1px solid #e9ecef;border-radius:8px;margin-bottom:8px;overflow:hidden">
          <div onclick="document.getElementById('${rid}').style.display=document.getElementById('${rid}').style.display==='none'?'block':'none'" style="padding:10px 12px;background:#f8f9fa;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600">▶ 방법${i+1}: ${esc(r.method)}</span>
            <span style="font-size:11px;color:var(--gray-500)">${esc(r.difficulty)} · ${esc(r.time)}</span>
          </div>
          <div id="${rid}" style="display:none;padding:10px 12px;font-size:13px">
            <div style="color:var(--gray-500);margin-bottom:6px">🛠️ 필요 공구: ${esc(r.tools)}</div>
            <div style="font-weight:600;margin:8px 0 4px">📋 진행 단계:</div>
            <ol style="margin:0;padding-left:20px;line-height:1.8">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
            ${r.warn.length?`<div style="margin-top:8px;padding:8px;background:#fff3bf;border-radius:6px;font-size:12px"><strong>⚠️ 주의사항:</strong><ul style="margin:4px 0 0;padding-left:16px">${r.warn.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
            <div style="margin-top:8px;padding:8px;background:#d3f9d8;border-radius:6px;font-size:12px"><strong>✅ 리셋 확인:</strong><ul style="margin:4px 0 0;padding-left:16px">${r.check.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>
            ${r.failNote?`<div style="margin-top:8px;padding:8px;background:#ffe3e3;border-radius:6px;font-size:12px">${esc(r.failNote)}</div>`:''}
          </div>
        </div>`;
      });
      body+=`</div>`;
    }

    if(sel.masterPw&&sel.masterPw.length){
      body+=`<div class="card" style="border-left-color:#7048e8">
        <div style="font-weight:700;font-size:15px;margin-bottom:8px">🔑 마스터 비밀번호 (시도용)</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${sel.masterPw.map(p=>`<span style="padding:4px 12px;background:#f3f0ff;border:1px solid #d0bfff;border-radius:8px;font-size:13px;font-family:monospace">${esc(p)}</span>`).join('')}</div>
        <div style="font-size:11px;color:var(--gray-500);margin-top:6px">⚠️ 3회 이상 틀리면 잠길 수 있으니 신중하게 시도</div>
      </div>`;
    }

    if(sel.pwSites&&sel.pwSites.length){
      body+=`<div class="card" style="border-left-color:#0ca678">
        <div style="font-weight:700;font-size:15px;margin-bottom:8px">🌐 온라인 비밀번호 복구 사이트</div>
        ${sel.pwSites.map(s=>`<div style="padding:6px 0;font-size:14px"><a href="https://${esc(s)}" target="_blank" rel="noopener" onclick="event.stopPropagation();window.open('https://${esc(s)}','_blank','width=600,height=700');return false;" style="color:#1971c2;text-decoration:underline;font-weight:600">🔗 ${esc(s)}</a></div>`).join('')}
        <div style="font-size:11px;color:var(--gray-500);margin-top:4px">서비스 태그/코드를 입력하면 마스터 비밀번호 생성</div>
      </div>`;
    }
  }

  el.innerHTML=`
    <div class="card" style="border-left-color:var(--primary)">
      <div style="font-weight:700;font-size:16px;margin-bottom:12px">📖 BIOS 기술 정보</div>
      <div class="fg" style="margin-bottom:10px">
        <label style="font-size:13px;font-weight:600">제조사 선택</label>
        <select onchange="infoState.maker=this.value;infoState.type='';renderInfoTab()" style="width:100%;padding:11px;border:1px solid #dee2e6;border-radius:9px;font-size:14px">
          <option value="">-- 제조사 선택 --</option>
          ${makers.map(m=>`<option value="${esc(m)}" ${infoState.maker===m?'selected':''}>${esc(m)}</option>`).join('')}
        </select>
      </div>
      ${types.length?`<div class="fg">
        <label style="font-size:13px;font-weight:600">제품 형태</label>
        <select onchange="infoState.type=this.value;renderInfoTab()" style="width:100%;padding:11px;border:1px solid #dee2e6;border-radius:9px;font-size:14px">
          <option value="">-- 형태 선택 --</option>
          ${types.map(t=>`<option value="${esc(t)}" ${infoState.type===t?'selected':''}>${esc(t)}</option>`).join('')}
        </select>
      </div>`:''}
    </div>
    ${body}`;
}

// ── 초기화 ──
(function init(){
  setupBackButton();
  const saved=localStorage.getItem('csep_eng');
  if(saved){ try{ S.engineer=JSON.parse(saved); connectSSE(); loadReceptions(true); setupPush(); setNativeRole(); pollIncoming(); return; }catch(e){} }
  renderLogin();
})();
setInterval(()=>{ if(S.engineer)loadReceptions(); }, 15000);
setInterval(pollIncoming, 3000);
</script>
</body>
</html>
