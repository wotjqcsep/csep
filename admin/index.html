<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSEP — 컴퓨터 A/S ERP</title>
<style>
:root{
  --primary:#3b5bdb; --primary-light:#e3f2fd; --success:#2f9e44; --warning:#f08c00;
  --danger:#e03131; --gray-50:#f8f9fa; --gray-100:#f1f3f5; --gray-200:#e9ecef;
  --gray-300:#dee2e6; --gray-400:#adb5bd; --gray-500:#868e96; --gray-600:#495057; --gray-700:#343a40;
  --card-bg:#ffffff; --input-bg:#ffffff; --input-border:#dee2e6;
  --body-bg:#f1f3f5; --hover-bg:#f8f9fa; --modal-bg:#ffffff; --modal-border:#e9ecef;
  --bar-bg:#1a1f2b; --bar-text:#e6e9ef; --tab-bg:#2a3654; --tab-text:#aeb9d4;
  --tab-hover:#313e5e; --tab-active:#1a1f2b; --shadow:rgba(0,0,0,.06);
  --memo-bg:#f3f0ff; --memo-border:#e5dbff; --memo-item-bg:#ffffff; --memo-item-border:#e5dbff;
  --dday-today-bg:#fff3bf; --dday-today-border:#fcc419;
  --dday-past-bg:#ffe3e3; --dday-past-border:#ffa8a8;
  --dday-soon-bg:#fff9db; --dday-soon-border:#ffe066;
  --notify-bg:#ffffff; --notify-head:#f8f9fa; --notify-border:#e9ecef;
  --badge-new-bg:#e7f5ff; --badge-new-c:#1971c2;
  --badge-assigned-bg:#fff3bf; --badge-assigned-c:#e67700;
  --badge-progress-bg:#d3f9d8; --badge-progress-c:#2b8a3e;
  --badge-repair-bg:#f3f0ff; --badge-repair-c:#7048e8;
  --lic-ok-bg:#d3f9d8; --lic-ok-c:#2b8a3e;
  --lic-warn-bg:#fff3bf; --lic-warn-c:#e67700;
  --lic-notice-bg:#fff8e1; --lic-notice-border:#ffe082; --lic-notice-c:#e65100;
  --lic-head-ok:#f0f4ff; --lic-head-warn:#fff8e1;
  --est-drop-bg:#ffffff;
  --btn-warn:#f08c00; --btn-blue:#1971c2; --btn-green:#0ca678; --btn-purple:#7048e8;
  --btn-edit:#3b5bdb; --btn-del:#e03131;
  --icon-phone:#495057; --icon-addr:#495057; --icon-contact:#495057;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',-apple-system,sans-serif;background:var(--body-bg);color:var(--gray-700);font-size:14px}
.app{min-height:100vh;display:flex;flex-direction:column}
/* 상단 탭 네비게이션 (필드서비스 스타일) */
.topbar{position:sticky;top:0;z-index:100}
.brandbar{background:var(--bar-bg);color:var(--bar-text);padding:13px 22px;display:flex;justify-content:space-between;align-items:center}
.brandbar .brand{font-size:20px;font-weight:800;color:#6b9cff;letter-spacing:.5px}
.brandbar .brand small{font-size:11px;color:#8b93a3;margin-left:9px;font-weight:400;letter-spacing:0}
.brandbar .right{display:flex;gap:12px;align-items:center;font-size:12px;color:#c8cdd8}
.tabbar{display:flex;background:var(--tab-bg);overflow-x:auto}
.tab-item{padding:12px 18px;color:var(--tab-text);cursor:pointer;font-size:14px;white-space:nowrap;border:none;background:none;display:flex;align-items:center;gap:7px;border-bottom:3px solid transparent;transition:background .12s,color .12s}
.tab-item:hover{color:#fff;background:var(--tab-hover)}
.tab-item.active{color:#fff;background:var(--tab-active);border-bottom-color:#6b9cff;font-weight:700}
.tab-icon{font-size:16px}
/* 메인 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.server-status{color:var(--success)}
.placeholder{background:var(--card-bg);border-radius:12px;padding:60px 24px;text-align:center;box-shadow:0 1px 3px var(--shadow);color:var(--gray-400)}
.placeholder .ph-icon{font-size:44px;margin-bottom:12px}
.placeholder .ph-title{font-size:18px;color:var(--gray-600);font-weight:700;margin-bottom:6px}
.page{padding:24px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.page-header h2{font-size:20px}
/* 버튼 */
.btn{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.btn:hover{opacity:.9}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn-secondary{background:var(--gray-300);color:var(--gray-700)}
.btn-success{background:var(--success)}
.btn-danger{background:var(--danger)}
/* 통계 카드 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card-bg);border-radius:12px;padding:16px;box-shadow:0 1px 3px var(--shadow)}
.stat-label{font-size:12px;color:var(--gray-500);margin-bottom:6px}
.stat-value{font-size:28px;font-weight:700}
/* 필터바 */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--gray-300);background:var(--card-bg);color:var(--gray-600);cursor:pointer;font-size:13px}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.search-input{padding:8px 14px;border-radius:20px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--gray-700);font-size:13px;min-width:220px}
select,input,textarea{font-family:inherit;font-size:14px;background:var(--input-bg);color:var(--gray-700);border-color:var(--input-border)}
/* 테이블 */
.table-container{background:var(--card-bg);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px var(--shadow)}
.table{width:100%;border-collapse:collapse}
.table th{background:var(--gray-50);padding:11px 14px;text-align:left;font-size:12px;color:var(--gray-500);border-bottom:1px solid var(--gray-200)}
.table td{padding:11px 14px;border-bottom:1px solid var(--gray-100);font-size:13px}
.table tr:hover{background:var(--hover-bg)}
.empty-state{text-align:center;padding:40px;color:var(--gray-400)}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.new{background:var(--badge-new-bg);color:var(--badge-new-c)}
.badge.assigned{background:var(--badge-assigned-bg);color:var(--badge-assigned-c)}
.badge.in_progress{background:var(--badge-progress-bg);color:var(--badge-progress-c)}
.badge.completed{background:var(--gray-300);color:var(--gray-600)}
.badge.cancelled{background:var(--gray-200);color:var(--gray-400)}
.badge.repairing{background:var(--badge-repair-bg);color:var(--badge-repair-c)}
.outstanding{color:var(--danger);font-weight:600}
/* 분할 레이아웃 */
.split{display:grid;grid-template-columns:1fr 380px;gap:16px}
.detail-panel{background:var(--card-bg);border-radius:12px;padding:18px;box-shadow:0 1px 3px var(--shadow);align-self:start;position:sticky;top:80px;max-height:calc(100vh-100px);overflow-y:auto}
.detail-panel h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.detail-row{display:flex;padding:6px 0;border-bottom:1px solid var(--gray-100)}
.detail-label{width:90px;color:var(--gray-500);font-size:12px;flex-shrink:0}
.detail-value{flex:1;font-size:13px}
.tabs{display:flex;border-bottom:2px solid var(--gray-200);margin-bottom:12px}
.tab{padding:7px 15px;border:none;background:none;cursor:pointer;font-size:13px;color:var(--gray-500);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--modal-bg);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px var(--shadow);border:1px solid var(--modal-border)}
.modal.wide{max-width:960px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--gray-200)}
.modal-head h3{font-size:17px}
.modal-close{border:none;background:none;font-size:22px;cursor:pointer;color:var(--gray-400)}
.modal-body{padding:22px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;margin-bottom:5px;color:var(--gray-600)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--input-border);border-radius:8px;background:var(--input-bg);color:var(--gray-700)}
.form-group textarea{min-height:70px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.form-section{margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--gray-600);border-top:1px solid var(--gray-200);padding-top:10px}
.loading{text-align:center;padding:60px;color:var(--gray-400)}
/* 검색 드롭다운 */
.cs-wrap{position:relative}
.cs-box{display:flex;align-items:center;gap:6px;border:1px solid var(--input-border);border-radius:8px;padding:8px 10px;background:var(--input-bg);cursor:text;min-height:38px}
.cs-box input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--gray-700)}
.cs-list{position:absolute;top:100%;left:0;right:0;z-index:100;background:var(--card-bg);border:1px solid var(--gray-300);border-radius:8px;box-shadow:0 4px 16px var(--shadow);max-height:220px;overflow-y:auto;margin-top:2px}
.cs-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--gray-200);color:var(--gray-600)}
.cs-item:hover{background:var(--hover-bg)}
/* 팝업 (전화/SMS) */
.popup-stack{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:10px;width:340px}
.popup{background:var(--card-bg);border-radius:12px;box-shadow:0 8px 30px var(--shadow);overflow:hidden;border-left:4px solid var(--primary)}
.popup.sms{border-left-color:var(--success)}
.popup-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--hover-bg)}
.popup-body{padding:14px 16px}
.chip{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;background:var(--gray-300);color:var(--gray-600)}
/* 작업현황 카드 (시인성 강화) */
.ws-wrap{max-width:1000px;margin:0 auto}
.ws-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ws-fbtn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;color:#fff}
.ws-date{display:flex;align-items:center;text-align:center;color:var(--gray-600);font-weight:700;font-size:13px;margin:22px 0 12px}
.ws-date::before,.ws-date::after{content:'';flex:1;height:1px;background:var(--gray-300)}
.ws-date span{padding:0 14px}
/* 구간 구분선 (미처리/예약/완료) */
.ws-sec{display:flex;align-items:center;text-align:center;margin:26px 0 15px}
.ws-sec::before,.ws-sec::after{content:'';flex:1;height:3px;border-radius:2px;background:var(--sec,var(--gray-300));opacity:.55}
.ws-sec span{margin:0 12px;padding:5px 16px;border-radius:16px;color:#fff;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ws-sec:first-child{margin-top:4px}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:680px){.ws-grid{grid-template-columns:1fr}}
.ws-card{background:var(--card-bg);border:1px solid var(--gray-200);border-left:5px solid var(--gray-400);border-radius:11px;padding:15px 17px;box-shadow:0 1px 3px var(--shadow)}
.ws-card.new{border-left-color:var(--danger)}
.ws-card.assigned{border-left-color:var(--danger)}
.ws-card.in_progress{border-left-color:#1971c2}
.ws-card.completed{border-left-color:var(--success)}
.ws-card.cancelled{border-left-color:#868e96}
.ws-card.repairing{border-left-color:#7048e8}
.ws-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
.ws-name{font-size:16px;font-weight:800;color:var(--gray-700)}
.ws-pill{padding:4px 12px;border-radius:13px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.ws-row{display:flex;gap:8px;font-size:13.5px;color:var(--gray-600);margin:4px 0;align-items:flex-start;line-height:1.45}
.ws-row .ic{width:17px;flex-shrink:0;text-align:center}
.ws-memo{background:var(--hover-bg);border:1px solid var(--gray-200);border-radius:7px;padding:9px 11px;font-size:13px;color:var(--gray-600);margin:9px 0}
.ws-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.ws-time{font-size:11px;color:var(--gray-400);margin-top:9px}
/* 거래처 */
.vd-wrap{max-width:900px;margin:0 auto}
.vd-search{width:100%;padding:13px 16px;border:1px solid var(--input-border);border-radius:10px;font-size:15px;margin-bottom:16px;background:var(--input-bg);color:var(--gray-700)}
.vd-card{background:var(--card-bg);border:1px solid var(--gray-200);border-radius:11px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shadow)}
.vd-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.vd-title{font-size:15.5px;font-weight:800;color:var(--gray-700);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.vd-sub{font-size:12px;font-weight:600;color:var(--warning)}
.vd-btns{display:flex;gap:5px;flex-wrap:wrap}
.vd-btns .btn{padding:5px 11px;font-size:12px;border-radius:7px}
.vd-row{display:flex;gap:6px;font-size:13px;color:var(--gray-600);margin-top:7px;flex-wrap:wrap;align-items:center}
.vd-row .ic{color:var(--gray-400)}
.vd-site{background:var(--hover-bg);border:1px solid var(--gray-200);border-radius:9px;padding:11px 13px;margin:10px 0 0 18px}
.vd-badge{background:var(--badge-repair-bg);color:var(--badge-repair-c);padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700}
.vd-sbadge{padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700}
/* 일정표 달력 */
.cal-wrap{max-width:920px;margin:0 auto}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-legend{display:flex;gap:16px;font-size:12px;color:var(--gray-600);margin:8px 2px 12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--gray-500);padding:3px 0}
.cal-day{background:var(--card-bg);border:1px solid var(--gray-200);border-radius:9px;min-height:66px;padding:6px 7px;cursor:pointer;display:flex;flex-direction:column;transition:background .1s}
.cal-day:hover{background:var(--hover-bg)}
.cal-day.empty{background:transparent;border:none;cursor:default}
.cal-day.sel{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.cal-num{font-size:13px;font-weight:700}
.cal-day.today .cal-num{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cal-dots{display:flex;flex-wrap:wrap;align-items:center;margin-top:auto}
/* 견적서 미리보기 — 동적 <style> 주입 없이 여기에 정의 */
#est_preview .doc{color:var(--gray-700);background:var(--card-bg);padding:20px;border:1px solid var(--gray-200);border-radius:8px}
@media print{
#est_preview .doc{color:#222;background:#fff}
#agency-settle-overlay{position:static!important;overflow:visible!important}
#agency-settle-overlay>div:first-child{display:none!important}
body>*:not(#agency-settle-overlay){display:none!important}
@page{size:A4 portrait;margin:12mm}
}
#est_preview .doc h1{text-align:center;letter-spacing:8px;border-bottom:3px solid var(--gray-300);padding-bottom:10px;color:var(--gray-700)}
#est_preview .doc .est-header{display:flex;gap:0;margin:12px 0 10px}
#est_preview .doc .est-biz{width:50%;border-collapse:collapse;table-layout:fixed}
#est_preview .doc .est-biz td{border:1px solid var(--gray-300);padding:4px 6px;font-size:12px;color:var(--gray-600)}
#est_preview .doc table.items{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
#est_preview .doc table.items th,#est_preview .doc table.items td{border:1px solid var(--gray-300);padding:7px 8px;color:var(--gray-600)}
#est_preview .doc table.items th{background:var(--hover-bg)}
#est_preview .doc .sum{margin-top:12px;margin-left:auto;width:300px;font-size:14px}
#est_preview .doc .sum td{border:none;padding:4px 8px}
#est_preview .doc .sum .tot{border-top:2px solid var(--gray-300);font-weight:900;font-size:17px}
#est_preview .doc .memo{margin-top:14px;font-size:12px;color:var(--gray-500);white-space:pre-wrap}
</style>

<script>
const API = '/api';
const state = { page:'dashboard', dashboard:null, customers:[], computers:[], engineers:[], receptions:[], jobs:[], sales:[], inventory:[], payments:[], stats:null, sites:[], partOptions:[], resultPresets:[], settings:{}, schedules:[] };
// MENUS, TITLES 는 menu.js 에서 정의됨 (메뉴 수정은 menu.js 한 곳에서)
const DEVICE_TYPES = { desktop:'데스크톱', laptop:'노트북', server:'서버', other:'기타' };

// ── 로그인 ──
async function doAdminLogin(){
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display='none';
  try{
    const r = await fetch(API+'/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    if(!r.ok){ errEl.textContent='비밀번호가 올바르지 않습니다'; errEl.style.display='block'; return; }
    const d = await r.json();
    sessionStorage.setItem('authToken', d.token);
    localStorage.setItem('csep_has_logged_in','1');
    document.getElementById('loginScreen').style.display='none';
    startApp();
  }catch(e){ errEl.textContent='서버 연결 실패'; errEl.style.display='block'; }
}
async function checkAuth(){
  const token = sessionStorage.getItem('authToken');
  if(token){ startApp(); return; }
  try{
    const r = await fetch(API+'/admin-password-status');
    const d = await r.json();
    if(!d.hasPassword){
      // 비밀번호가 공란 → 자동 로그인
      const lr = await fetch(API+'/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:''})});
      if(lr.ok){ const ld=await lr.json(); sessionStorage.setItem('authToken',ld.token); startApp(); return; }
    }
  }catch(e){}
  if(!localStorage.getItem('csep_has_logged_in')) document.getElementById('loginHint').style.display='block';
  document.getElementById('loginScreen').style.display='flex';
}

// ── API 헬퍼 ──
async function api(method, url, body){
  const opt = { method, headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+(sessionStorage.getItem('authToken')||'')} };
  if(body) opt.body = JSON.stringify(body);
  const r = await fetch(API+url, opt);
  if(r.status === 401){ sessionStorage.removeItem('authToken'); document.getElementById('loginScreen').style.display='flex'; throw new Error('인증 만료'); }
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status);
  return r.json();
}
const digits = s => (s||'').replace(/\D/g,'');
const won = n => '₩'+(Number(n)||0).toLocaleString();
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── 데이터 로딩 (백그라운드) ──
let firstLoad = true;
let _loadAllTimer = null, _loadAllRunning = false;
async function loadAll(showLoading){
  // SSE 등으로 짧은 시간에 여러 번 호출되면 마지막 1건만 실행 (debounce 300ms)
  if(!showLoading && !firstLoad){
    clearTimeout(_loadAllTimer);
    if(_loadAllRunning) return;   // 이미 실행 중이면 스킵
    return new Promise(resolve=>{
      _loadAllTimer = setTimeout(()=>_doLoadAll(false).then(resolve), 300);
    });
  }
  return _doLoadAll(showLoading);
}
async function _doLoadAll(showLoading){
  if(_loadAllRunning) return;
  _loadAllRunning = true;
  try{
  if(showLoading && firstLoad) document.getElementById('page').innerHTML='<div class="loading">불러오는 중...</div>';
  const allJobs = [
    ['dashboard','/dashboard'],['customers','/customers'],['computers','/computers'],['engineers','/engineers'],
    ['receptions','/receptions'],['jobs','/jobs'],['sales','/sales'],['inventory','/inventory'],['payments','/payments'],['stats','/stats'],['sites','/sites'],['partOptions','/part-options'],['resultPresets','/result-presets'],['settings','/settings'],['schedules','/schedules'],
  ];
  const jobs = (!firstLoad && state.page==='estimates') ? allJobs.filter(([k])=>k==='customers'||k==='engineers'||k==='settings') : allJobs;
  const results = await Promise.allSettled(jobs.map(([,u])=>api('GET',u)));
  let anyOk=false;
  results.forEach((r,i)=>{ if(r.status==='fulfilled'){ state[jobs[i][0]] = r.value; anyOk=true; } });
  document.getElementById('srvStatus').textContent = anyOk ? '● 서버 연결' : '● 연결 끊김';
  document.getElementById('srvStatus').style.color = anyOk ? 'var(--success)' : 'var(--danger)';
  // 입력 중(검색창·폼 입력칸)엔 배경 새로고침이 화면을 다시 그리지 않게 (타이핑 유실 방지)
  const ae = document.activeElement;
  const typing = ae && ( (ae.classList && ae.classList.contains('vd-search')) || ae.tagName==='INPUT' || ae.tagName==='TEXTAREA');
  if(firstLoad){ firstLoad=false; render(); if(typeof initCompletionTracking==='function') initCompletionTracking(); } else if(!document.querySelector('.modal-overlay') && !typing && state.page!=='estimates') render();
  }finally{ _loadAllRunning = false; }
}

// ── 네비게이션 (상단 탭) ──
function renderNav(){
  const items = MENUS.flatMap(m=>m.items);
  const firstRight = items.findIndex(it=>it[3]);
  document.getElementById('nav').innerHTML = items.map(([id,icon,label],i)=>{
    const allowed = typeof isMenuAllowed==='function' ? isMenuAllowed(id) : true;
    const ml = i===firstRight?' margin-left:auto;':'';
    if(!allowed) return `<button class="tab-item" style="${ml}opacity:.35;cursor:not-allowed" onclick="alert('오프라인 모드에서는 사용할 수 없는 메뉴입니다.')" title="오프라인 제한"><span class="tab-icon">${icon}</span><span>${label}</span></button>`;
    return `<button class="tab-item ${state.page===id?'active':''}" style="${ml}" onclick="go('${id}')"><span class="tab-icon">${icon}</span><span>${label}</span></button>`;
  }).join('');
}
let _estForceRender=false;
function go(page){
  if(typeof isMenuAllowed==='function' && !isMenuAllowed(page)){ alert('오프라인 모드에서는 사용할 수 없는 메뉴입니다.'); return; }
  state.page=page; if(page==='estimates') _estForceRender=true; renderNav(); render();
}

// ── 렌더 라우터 ──
function render(){
  renderNav();
  const el = document.getElementById('page');
  if(state.page==='estimates' && !_estForceRender && document.getElementById('est_body')) return;
  _estForceRender=false;
  const r = pageRenderer(state.page);
  el.innerHTML = r ? r() : placeholderPage(state.page);
  if(state.page==='estimates'){ setTimeout(()=>{ if(typeof estUpdateFee==='function') estUpdateFee(); if(typeof estRenderPreview==='function') estRenderPreview(); if(typeof _estSavedOpen!=='undefined' && _estSavedOpen && typeof estLoadList==='function') estLoadList(); },50); }
}
// 렌더 함수가 아직 없는 메뉴 → "준비 중" 안내 (메뉴만)
function placeholderPage(id){
  return `<div class="placeholder">
    <div class="ph-icon">🚧</div>
    <div class="ph-title">${esc(TITLES[id]||'')}</div>
    <div>준비 중입니다. 메뉴만 먼저 만들어 두었습니다.</div>
  </div>`;
}

// ── 대시보드 ──
function renderDashboard(){
  const d = state.dashboard; if(!d) return '<div class="loading">불러오는 중...</div>';
  return `
  <div class="stat-grid">
    ${statCard('오늘 신규 접수', d.today_new)}
    ${statCard('미처리', d.assigned_pending, d.assigned_pending>0?'var(--danger)':'')}
    ${statCard('진행 중', d.in_progress, 'var(--success)')}
    ${statCard('오늘 완료', d.completed_today, 'var(--gray-500)')}
    ${statCard('총 미수금', won(d.total_outstanding), d.total_outstanding>0?'var(--danger)':'', 20)}
    ${statCard('재고 부족', (d.low_stock_count||0)+'종', d.low_stock_count>0?'var(--danger)':'', 22)}
  </div>
  <div class="split" style="grid-template-columns:1fr 1fr">
    ${renderDdayPanel()}
    <div class="detail-panel" style="position:static">
      <h3>대기 접수</h3>
      ${(d.pending_receptions||[]).length? d.pending_receptions.map(r=>`<div class="detail-row"><span class="detail-value">${esc(custName(r.customer_id))} - ${esc(r.symptom||'')}</span><span><span class="badge ${r.status}">${statusLabel(r.status)}</span></span></div>`).join('') : '<div class="empty-state">대기 접수 없음</div>'}
    </div>
  </div>`;
}
function renderDdayPanel(){
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  const todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const todayMs=new Date(todayKey+'T00:00:00').getTime();
  const items=[];
  // 메모 일정
  (state.schedules||[]).forEach(s=>{
    if(!s.date)return;
    const d=new Date(s.date+'T00:00:00'); if(isNaN(d))return;
    const diff=Math.round((d.getTime()-todayMs)/(24*60*60*1000));
    if(diff<-7) return;
    items.push({date:s.date,diff,title:s.title,sub:'',type:'memo',id:s.id});
  });
  // 예약 접수
  (state.receptions||[]).forEach(r=>{
    if(!r.reserved_date||r.status==='completed'||r.status==='cancelled')return;
    const dk=String(r.reserved_date).slice(0,10);
    const d=new Date(dk+'T00:00:00'); if(isNaN(d))return;
    const diff=Math.round((d.getTime()-todayMs)/(24*60*60*1000));
    if(diff<-7) return;
    items.push({date:dk,diff,title:custName(r.customer_id),sub:r.symptom||'',type:'reserved'});
  });
  items.sort((a,b)=>a.diff-b.diff||a.title.localeCompare(b.title));
  if(!items.length) return `<div class="detail-panel" style="position:static"><h3 style="margin-bottom:12px">📅 일정 · D-Day</h3><div class="empty-state">등록된 일정 없음</div></div>`;
  const ddayLabel=diff=>{ if(diff===0)return 'D-Day'; if(diff>0)return `D-${diff}`; return `D+${Math.abs(diff)}`; };
  const rows=items.map(it=>{
    const isToday=it.diff===0, isPast=it.diff<0, isSoon=it.diff>0&&it.diff<=3;
    const bg=isToday?'background:var(--dday-today-bg);border:2px solid var(--dday-today-border)':isPast?'background:var(--dday-past-bg);border:1px solid var(--dday-past-border)':isSoon?'background:var(--dday-soon-bg);border:1px solid var(--dday-soon-border)':'background:var(--card-bg);border:1px solid var(--gray-200)';
    const ddayColor=isToday?'#e03131':isPast?'#868e96':isSoon?'#e67700':'var(--primary)';
    const icon=it.type==='memo'?'📝':'📋';
    return `<div style="${bg};border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px">
      <div style="min-width:52px;text-align:center">
        <div style="font-size:18px;font-weight:900;color:${ddayColor}">${ddayLabel(it.diff)}</div>
        <div style="font-size:10px;color:var(--gray-400)">${it.date.slice(5)}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px"><span>${icon}</span><strong style="font-size:14px;${isToday?'color:#e03131':''}">${esc(it.title)}</strong></div>
        ${it.sub?`<div style="font-size:12px;color:var(--gray-500);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.sub)}</div>`:''}
      </div>
    </div>`;
  }).join('');
  return `<div class="detail-panel" style="position:static">
    <h3 style="margin-bottom:12px">📅 일정 · D-Day</h3>
    <div style="display:flex;flex-direction:column;gap:8px">${rows}</div>
  </div>`;
}
function statCard(label,value,color,size){ return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value" style="${color?`color:${color};`:''}${size?`font-size:${size}px;`:''}">${value}</div></div>`; }
function statusLabel(s){ return {idle:'대기',on_the_way:'출동',working:'작업중',off_duty:'퇴근',new:'미처리',assigned:'미처리',in_progress:'진행중',repairing:'수거·점검',completed:'완료'}[s]||s; }
function custName(id){ const c=state.customers.find(c=>c.id==id); if(!c) return id?`고객${id}`:'-'; return c.name||c.phone||`고객${c.id}`; }
function engName(id){ return (state.engineers.find(e=>e.id==id)||{}).name || '-'; }
// 담당별 색 (기사앱과 동일 규칙: 대표=빨강, 기사=id별 고정색)
const ENG_PALETTE=['#1971c2','#2f9e44','#e8590c','#6741d9','#0c8599','#c2255c','#5c940d','#1098ad'];
function engColor(id){ const e=state.engineers.find(x=>x.id==id); if(!e) return '#868e96'; if(e.is_admin) return '#e03131'; return ENG_PALETTE[(Number(e.id)||0)%ENG_PALETTE.length]; }
// 담당 이름을 색+굵게 (대표 표시 포함). 미지정은 회색
function engBadge(id){ if(!id) return '<span style="color:var(--gray-400)">미지정</span>'; const c=engColor(id); const e=state.engineers.find(x=>x.id==id); return `<span style="color:${c};font-weight:700">${esc(engName(id))}${e&&e.is_admin?' (대표)':''}</span>`; }

// (페이지 렌더러/모달은 app.js, modals.js)
</script>
<script src="app.js"></script>
<script src="modals.js"></script>
</body>
</html>
